name: Quality Gate

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: quality-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies from lockfile
        # SheetJS 0.20.x is distributed from its own CDN, which occasionally
        # returns a transient 5xx. Retry the entire clean install, but still
        # fail the gate after three attempts.
        run: |
          for attempt in 1 2 3; do
            npm ci && exit 0
            if [ "$attempt" -eq 3 ]; then exit 1; fi
            sleep $((attempt * 10))
          done

      - name: Reject high or critical dependency vulnerabilities
        run: npm audit --audit-level=high

      - name: Install Chromium for browser regression
        run: npx playwright install --with-deps chromium

      - name: Lint
        run: npm run lint

      - name: Unit tests and coverage regression gate
        run: npm run test:coverage:gate

      - name: SQL integrity tests
        run: npm run test:integrity

      - name: Production build
        run: npm run build

      - name: Browser regression
        run: npm run test:e2e
