name: Staging Concurrency

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  two-real-connections:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: staging
    env:
      STAGING_SUPABASE_URL: ${{ secrets.STAGING_SUPABASE_URL }}
      STAGING_SUPABASE_ANON_KEY: ${{ secrets.STAGING_SUPABASE_ANON_KEY }}
      STAGING_TEST_EMAIL: ${{ secrets.STAGING_TEST_EMAIL }}
      STAGING_TEST_PASSWORD: ${{ secrets.STAGING_TEST_PASSWORD }}
      STAGING_SHOP_ID: ${{ secrets.STAGING_SHOP_ID }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Race the same idempotency key over two authenticated clients
        run: npm run test:staging-concurrency
