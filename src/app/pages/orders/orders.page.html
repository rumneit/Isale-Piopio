<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-back-button defaultHref="/home" />
    </ion-buttons>
    <ion-title>Đơn hàng</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="exportCsv()">
        <ion-icon slot="icon-only" name="download-outline" />
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
  <ion-toolbar>
    <ion-searchbar placeholder="Tìm theo mã đơn hoặc khách hàng" [debounce]="300" (ionInput)="onSearch($any($event))" />
  </ion-toolbar>
  <ion-toolbar>
    <ion-segment [value]="statusFilter()" (ionChange)="onFilter($any($event))">
      <ion-segment-button value="all"><ion-label>Tất cả</ion-label></ion-segment-button>
      <ion-segment-button value="paid"><ion-label>Đã trả</ion-label></ion-segment-button>
      <ion-segment-button value="unpaid"><ion-label>Còn nợ</ion-label></ion-segment-button>
    </ion-segment>
  </ion-toolbar>
</ion-header>

<ion-content class="app-page">
  <ion-refresher slot="fixed" (ionRefresh)="doRefresh($any($event))">
    <ion-refresher-content />
  </ion-refresher>

  <div class="app-page-container">
    @if (loading()) {
      <div class="page-loading"><ion-spinner name="crescent" /></div>
    } @else if (items().length === 0) {
      <div class="app-empty">
        <div><ion-icon name="cart-outline" /></div>
        Chưa có đơn hàng nào
      </div>
    } @else {
      <div class="app-card">
        <ion-list lines="full">
          @for (item of items(); track item.id) {
            <ion-item button (click)="openDetail(item)" detail="true">
              <ion-icon slot="start" [name]="item.paid ? 'checkmark-circle-outline' : 'alert-circle-outline'"
                [color]="item.paid ? 'success' : 'warning'" />
              <ion-label>
                <h3>{{ item.code }}</h3>
                <p>{{ item.customer_name ?? 'Khách lẻ' }} · {{ item.created_at | date: 'dd/MM HH:mm' }}</p>
              </ion-label>
              <ion-badge slot="end" [color]="item.paid ? 'success' : 'warning'">
                {{ formatMoney(item.total) }}
              </ion-badge>
            </ion-item>
          }
        </ion-list>
      </div>
    }
  </div>

  <ion-fab slot="fixed" vertical="bottom" horizontal="end">
    <ion-fab-button (click)="openAdd()">
      <ion-icon name="add-outline" />
    </ion-fab-button>
  </ion-fab>
</ion-content>
