<ion-header>
  <ion-toolbar>
    <ion-buttons slot="start">
      <ion-button (click)="goBack()">
        <ion-icon slot="icon-only" name="close-outline" />
      </ion-button>
      <ion-button (click)="openHome()">
        <ion-icon slot="icon-only" name="home-outline" />
      </ion-button>
    </ion-buttons>
    <ion-title>Giao dịch mới</ion-title>
    <ion-buttons slot="end">
      <ion-button (click)="save()" [disabled]="busy()">
        @if (busy()) {
          <ion-spinner name="crescent" />
        } @else {
          <ion-icon slot="icon-only" name="save-outline" />
        }
      </ion-button>
    </ion-buttons>
  </ion-toolbar>
</ion-header>

<ion-content class="app-page">
  <div class="app-page-container">
    @if (error) {
      <div class="form-error">{{ error }}</div>
    }

    <ion-segment [value]="type" (ionChange)="onTypeChange($any($event))" class="trade-type-segment">
      <ion-segment-button value="expense">
        <ion-icon name="trending-down-outline" color="danger" />
        <ion-label>Chi tiền</ion-label>
      </ion-segment-button>
      <ion-segment-button value="income">
        <ion-icon name="trending-up-outline" color="success" />
        <ion-label>Thu tiền</ion-label>
      </ion-segment-button>
    </ion-segment>

    <div class="app-card">
      <ion-list lines="full">
        <ion-item>
          <ion-input
            label="Số tiền (₫) *"
            labelPlacement="floating"
            type="number"
            inputmode="decimal"
            min="0"
            [(ngModel)]="amount"
            placeholder="0"
            class="trade-amount-input"
          />
        </ion-item>
        <ion-item>
          <ion-select label="Nhóm" labelPlacement="floating" [(ngModel)]="category" interface="action-sheet" cancelText="Đóng">
            @for (c of categories; track c) {
              <ion-select-option [value]="c">{{ c }}</ion-select-option>
            }
          </ion-select>
        </ion-item>
        <ion-item>
          <ion-input label="Ghi chú" labelPlacement="floating" [(ngModel)]="note" placeholder="VD: Nhập hàng trà sữa..." />
        </ion-item>
      </ion-list>
      <ion-note class="trade-date-note">Ghi nhận tại thời điểm hiện tại</ion-note>
    </div>

    <ion-button expand="block" size="large" (click)="save()" [disabled]="busy()">
      Lưu giao dịch
    </ion-button>
  </div>
</ion-content>
